                                                </button>
                                            </td>
                                        </tr>
                                    ))
                                )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                {/* COT PHAI - GIO HANG */}
                <div className="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5 flex flex-col justify-between">
                    <div>
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider mb-4 pb-2 border-b border-slate-800">
                            Chi Tiết Đơn Hàng POS
                        </h3>

                        <div className="space-y-3 mb-4 bg-slate-950 p-3 rounded-xl border border-slate-800">
                            <div>
                                <label className="text-[11px] text-slate-400 mb-1 block">Mã Nhân Viên Lập HĐ (*):</label>
                                <input
                                    type="number"
                                    min="1"
                                    required
                                    placeholder="Nhập ID Nhân viên (VD: 1)..."
                                    value={employeeId}
                                    onChange={e => setEmployeeId(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:border-blue-500 focus:outline-none font-mono"
                                />
                            </div>
                            <div>
                                <label className="text-[11px] text-slate-400 mb-1 block">Mã Khách Hàng (*):</label>
                                <input
                                    type="number"
                                    min="1"
                                    required
                                    placeholder="Nhập ID Khách hàng (VD: 1)..."
                                    value={customerId}
                                    onChange={e => setCustomerId(e.target.value)}
                                    className="w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-1.5 text-xs text-slate-200 focus:border-blue-500 focus:outline-none font-mono"
                                />
                            </div>
                        </div>

                        <div className="space-y-2 max-h-56 overflow-y-auto pr-1">
                            {cart.length === 0 ? (
                                <div className="text-center py-8 border border-dashed border-slate-800 rounded-xl">
                                    <p className="text-xs text-slate-500 italic">Giỏ hàng đang trống</p>
                                    <p className="text-[10px] text-slate-600 mt-1">Click sản phẩm bên trái để chọn</p>
                                </div>
                            ) : (
                                cart.map(item => (
                                    <div key={item.productID} className="flex items-center justify-between text-xs bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                                        <div className="flex-1 pr-2">
                                            <div className="font-semibold text-slate-200 truncate">{item.productName}</div>
                                            <div className="text-slate-400 text-[10px] font-mono">
                                                {item.unitPrice.toLocaleString('vi-VN')} ₫
                                            </div>
                                        </div>

                                        <div className="flex items-center space-x-1.5 bg-slate-900 border border-slate-800 rounded-lg px-1.5 py-0.5">
                                            <button
                                                onClick={() => updateQty(item.productID, -1)}
                                                className="text-slate-400 hover:text-white px-1 text-xs font-bold"
                                            >
                                                -
                                            </button>
                                            <span className="text-xs font-bold text-blue-400 font-mono px-1">{item.quantity}</span>
                                            <button
                                                onClick={() => updateQty(item.productID, 1)}
                                                className="text-slate-400 hover:text-white px-1 text-xs font-bold"
                                            >
                                                +
                                            </button>
                                        </div>

                                        <div className="text-right pl-3">
                                            <div className="font-bold text-emerald-400 font-mono text-xs">
                                                {(item.quantity * item.unitPrice).toLocaleString('vi-VN')} ₫
                                            </div>
                                            <button
                                                onClick={() => removeFromCart(item.productID)}
                                                className="text-[10px] text-red-400 hover:underline block ml-auto mt-0.5"
                                            >
                                                Xóa
                                            </button>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <div className="pt-4 border-t border-slate-800 mt-4">
                        <div className="flex items-center justify-between text-xs mb-3">
                            <span className="text-slate-400 font-medium">Tổng Tiền Hóa Đơn:</span>
                            <span className="text-base font-bold text-emerald-400 font-mono">
                            {totalAmount.toLocaleString('vi-VN')} ₫
                        </span>
                        </div>

                        <button
                            onClick={handleCheckout}
                            disabled={cart.length === 0}
                            className="w-full bg-emerald-600 hover:bg-emerald-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20"
                        >
                            Thanh Toán & Lưu CSDL
                        </button>
                    </div>
                </div>

                {/* MODAL CHI TIET */}
                {detailModal.show && (
                    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full shadow-2xl animate-fade-in">
                            <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                                <h4 className="text-xs font-bold text-slate-200 uppercase tracking-wider">
                                    Chi Tiết Hóa Đơn #HĐ00{detailModal.invoiceId}
                                </h4>
                                <button
                                    onClick={() => setDetailModal({ show: false, invoiceId: null, items: [] })}
                                    className="text-slate-400 hover:text-white text-xs font-bold"
                                >
                                    ✕
                                </button>
                            </div>

                            <div className="space-y-2 max-h-60 overflow-y-auto mb-4">
                                <table className="w-full text-left text-xs">
                                    <thead>
                                    <tr className="border-b border-slate-800 text-slate-400">
                                        <th className="pb-2">Sản Phẩm</th>
                                        <th className="pb-2 text-center">SL</th>
                                        <th className="pb-2 text-right">Đơn Giá</th>
                                        <th className="pb-2 text-right">Thành Tiền</th>
                                    </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-800/50">
                                    {detailModal.items.map((item, idx) => (
                                        <tr key={idx}>
                                            <td className="py-2 text-slate-200 font-medium">{item[0]}</td>
                                            <td className="py-2 text-center font-bold text-blue-400 font-mono">{item[1]}</td>
                                            <td className="py-2 text-right text-slate-400 font-mono">{item[2]}</td>
                                            <td className="py-2 text-right font-bold text-emerald-400 font-mono">{item[3]}</td>
                                        </tr>
                                    ))}
                                    </tbody>
                                </table>
                            </div>

                            <button
                                onClick={() => setDetailModal({ show: false, invoiceId: null, items: [] })}
                                className="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition"
                            >
                                Đóng cửa sổ
                            </button>
                        </div>
                    </div>
                )}

                {/* MODAL XOA */}
                {deleteModal.show && (
                    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-fade-in">
                            <div className="w-12 h-12 rounded-full bg-red-500/10 border border-red-500/20 text-red-500 flex items-center justify-center mx-auto mb-4 text-xl">
                                ⚠️
                            </div>
                            <h4 className="text-sm font-bold text-slate-200 text-center mb-2">Xác nhận xóa hóa đơn?</h4>
                            <p className="text-xs text-slate-400 text-center mb-6">
                                Xóa hóa đơn <span className="text-red-400 font-semibold">#HĐ00{deleteModal.id}</span> sẽ tự động <span className="text-emerald-400 font-semibold">hoàn trả lại số lượng tồn kho</span> cho sản phẩm.
                            </p>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setDeleteModal({ show: false, id: null })}
                                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition"
                                >
                                    Hủy bỏ
                                </button>
                                <button
                                    onClick={confirmDelete}
                                    className="flex-1 bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded-xl text-xs transition shadow-lg shadow-red-600/20"
                                >
                                    Đồng ý Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // --- MODULE 6: NHẬP HÀNG KHO (KẾT NỐI API /api/import-orders) ---
    function ImportView({ importOrders = [], onRefreshData, showToast }) {
        // Form state nhập tay 100%
        const [supplierId, setSupplierId] = React.useState('');
        const [employeeId, setEmployeeId] = React.useState('');

        // Giỏ hàng nhập
        const [items, setItems] = React.useState([]);
        const [productId, setProductId] = React.useState('');
        const [quantity, setQuantity] = React.useState('');
        const [importPrice, setImportPrice] = React.useState('');

        // State riêng cho tính năng LỌC ĐƠN NHẬP KHO theo Mã NCC
        const [filterSupplierId, setFilterSupplierId] = React.useState('');
        const [filteredOrders, setFilteredOrders] = React.useState(null);

        // Modal xem chi tiết đơn nhập
        const [selectedOrder, setSelectedOrder] = React.useState(null);
        const [orderDetails, setOrderDetails] = React.useState([]);
        const [loadingDetails, setLoadingDetails] = React.useState(false);
        const [isSubmitting, setIsSubmitting] = React.useState(false);

        // Hàm gọi API lọc đơn nhập theo ID Nhà Cung Cấp
        const handleFilter = async (e) => {
            e.preventDefault();
            if (!filterSupplierId || filterSupplierId.trim() === '') {
                setFilteredOrders(null); // Reset về danh sách ban đầu nếu ô rỗng
                return;
            }

            const supId = parseInt(filterSupplierId);
            if (isNaN(supId) || supId <= 0) {
                if (showToast) showToast('Mã nhà cung cấp để lọc phải là số dương!', 'error');
                return;
            }

            try {
                const res = await fetch(`/api/import-orders?supplierId=${supId}`);
                if (res.ok) {
                    const data = await res.json();
                    setFilteredOrders(data);
                } else {
                    if (showToast) showToast('Không thể lọc danh sách đơn nhập!', 'error');
                }
            } catch (err) {
                console.error("Filter error:", err);
                if (showToast) showToast('Lỗi kết nối máy chủ!', 'error');
            }
        };

        // Reset bộ lọc
        const handleResetFilter = () => {
            setFilterSupplierId('');
            setFilteredOrders(null);
        };

        // Danh sách hiển thị ưu tiên danh sách đã lọc (nếu có)
        const displayOrders = filteredOrders !== null ? filteredOrders : importOrders;

        // Thêm sản phẩm vào danh sách tạm nhập
        const handleAddItem = (e) => {
            e.preventDefault();
            const pId = parseInt(productId);
            const qty = parseInt(quantity);
            const price = parseFloat(importPrice);

            if (!pId || pId <= 0) {
                if (showToast) showToast('Mã sản phẩm phải là số nguyên dương!', 'error');
                return;
            }
            if (!qty || qty <= 0) {
                if (showToast) showToast('Số lượng nhập phải lớn hơn 0!', 'error');
                return;
            }
            if (isNaN(price) || price <= 0) {
                if (showToast) showToast('Giá nhập phải lớn hơn 0!', 'error');
                return;
            }

            const existingIndex = items.findIndex(item => item.productID === pId);
            if (existingIndex > -1) {
                const updatedItems = [...items];
                updatedItems[existingIndex].quantity += qty;
                updatedItems[existingIndex].importPrice = price;
                setItems(updatedItems);
            } else {
                setItems([...items, { productID: pId, quantity: qty, importPrice: price }]);
            }

            setProductId('');
            setQuantity('');
            setImportPrice('');
        };

        const handleRemoveItem = (index) => {
            setItems(items.filter((_, i) => i !== index));
        };

        const calculatedTotal = items.reduce((sum, item) => sum + (item.quantity * item.importPrice), 0);

        const handleCreateImport = async () => {
            const supId = parseInt(supplierId);
            const empId = parseInt(employeeId);

            if (!supId || supId <= 0) {
                if (showToast) showToast('Mã nhà cung cấp không hợp lệ!', 'error');
                return;
            }
            if (!empId || empId <= 0) {
                if (showToast) showToast('Mã nhân viên tạo đơn không hợp lệ!', 'error');
                return;
            }
            if (items.length === 0) {
                if (showToast) showToast('Đơn nhập hàng phải có ít nhất 1 sản phẩm!', 'error');
                return;
            }

            setIsSubmitting(true);
            const requestPayload = {
                supplierId: supId,
                employeeId: empId,
                details: items
            };

            try {
                const res = await fetch('/api/import-orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(requestPayload)
                });

                const data = await res.json();

                if (res.ok && data.success !== false) {
                    if (showToast) showToast(data.message || 'Tạo đơn nhập hàng thành công!');
                    setSupplierId('');
                    setEmployeeId('');
                    setItems([]);
                    setFilteredOrders(null); // Reset bộ lọc nếu đang bật
                    if (onRefreshData) onRefreshData();
                } else {
                    if (showToast) showToast(data.message || 'Tạo đơn nhập hàng thất bại!', 'error');
                }
            } catch (err) {
                console.error('Import Error:', err);
                if (showToast) showToast('Lỗi kết nối máy chủ backend!', 'error');
            } finally {
                setIsSubmitting(false);
            }
        };

        const handleViewDetails = async (orderId) => {
            setSelectedOrder(orderId);
            setLoadingDetails(true);
            try {
                const res = await fetch(`/api/import-orders/${orderId}/details`);
                const data = await res.json();
                setOrderDetails(data);
            } catch (err) {
                console.error('Fetch Details Error:', err);
                if (showToast) showToast('Không thể tải chi tiết đơn nhập!', 'error');
            } finally {
                setLoadingDetails(false);
            }
        };

        return (
            <div class="space-y-6">
                {/* FORM TẠO ĐƠN NHẬP HÀNG KHO */}
                <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-md">
                    <div class="flex items-center justify-between mb-6 pb-3 border-b border-slate-800">
                        <div class="flex items-center gap-2">
                            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
                            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Tạo Phiếu Nhập Hàng Tự Động Cộng Kho</h3>
                        </div>
                        <span class="text-[11px] text-slate-500 font-mono">100% Manual Input</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6">
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase">Mã Nhà Cung Cấp (ID)</label>
                            <input
                                type="number"
                                min="1"
                                placeholder="Nhập ID NCC (VD: 1, 2...)"
                                value={supplierId}
                                onChange={(e) => setSupplierId(e.target.value)}
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition-colors"
                            />
                        </div>
                        <div>
                            <label class="block text-[11px] font-semibold text-slate-400 mb-1.5 uppercase">Mã Nhân Viên Nhập Kho (ID)</label>
                            <input
                                type="number"
                                min="1"
                                placeholder="Nhập ID NV (VD: 1, 2...)"
                                value={employeeId}
                                onChange={(e) => setEmployeeId(e.target.value)}
                                class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 transition-colors"
                            />
                        </div>
                    </div>

                    <form onSubmit={handleAddItem} class="p-4 bg-slate-950/60 rounded-xl border border-slate-800/60 mb-6">
                        <div class="text-[11px] font-semibold text-slate-400 mb-3 uppercase flex items-center gap-1.5">
                            <span class="text-blue-400">+</span> Thêm Sản Phẩm Nhập
                        </div>
                        <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                            <input
                                type="number"
                                min="1"
                                placeholder="Mã Sản Phẩm (ID)"
                                value={productId}
                                onChange={(e) => setProductId(e.target.value)}
                                class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500"
                            />
                            <input
                                type="number"
                                min="1"
                                placeholder="Số lượng"
                                value={quantity}
                                onChange={(e) => setQuantity(e.target.value)}
                                class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500"
                            />
                            <input
                                type="number"
                                step="0.01"
                                min="0"
                                placeholder="Giá nhập (VNĐ)"
                                value={importPrice}
                                onChange={(e) => setImportPrice(e.target.value)}
                                class="bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500"
                            />
                            <button
                                type="submit"
                                class="bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg px-4 py-2 text-xs transition-colors flex items-center justify-center gap-1.5 shadow-lg shadow-blue-600/20"
                            >
                                Thêm Vào Đơn
                            </button>
                        </div>
                    </form>

                    {items.length > 0 && (
                        <div class="mb-6 overflow-hidden rounded-xl border border-slate-800">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-950 text-slate-400">
                                <tr>
                                    <th class="py-2.5 px-3">Mã SP</th>
                                    <th class="py-2.5 px-3">Số Lượng</th>
                                    <th class="py-2.5 px-3">Giá Nhập</th>
                                    <th class="py-2.5 px-3">Thành Tiền</th>
                                    <th class="py-2.5 px-3 text-right">Thao Tác</th>
                                </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/60 bg-slate-900/30">
                                {items.map((item, idx) => (
                                    <tr key={idx} class="hover:bg-slate-800/20">
                                        <td class="py-2.5 px-3 font-bold text-slate-300">#{item.productID}</td>
                                        <td class="py-2.5 px-3 text-emerald-400 font-semibold">+{item.quantity}</td>
                                        <td class="py-2.5 px-3 text-slate-300">{Number(item.importPrice).toLocaleString('vi-VN')} ₫</td>
                                        <td class="py-2.5 px-3 font-bold text-blue-400">{(item.quantity * item.importPrice).toLocaleString('vi-VN')} ₫</td>
                                        <td class="py-2.5 px-3 text-right">
                                            <button
                                                onClick={() => handleRemoveItem(idx)}
                                                class="text-rose-400 hover:text-rose-300 hover:underline text-[11px]"
                                            >
                                                Xóa
                                            </button>
                                        </td>
                                    </tr>
                                ))}
                                </tbody>
                            </table>
                        </div>
                    )}

                    <div class="flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-slate-800">
                        <div class="text-xs text-slate-400">
                            Tổng giá trị nhập: <span class="text-lg font-bold text-emerald-400 ml-1">{calculatedTotal.toLocaleString('vi-VN')} ₫</span>
                        </div>
                        <button
                            onClick={handleCreateImport}
                            disabled={isSubmitting || items.length === 0}
                            class="w-full sm:w-auto bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 disabled:cursor-not-allowed text-white font-bold rounded-xl px-6 py-2.5 text-xs transition-colors shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2"
                        >
                            {isSubmitting ? 'Đang Xử Lý...' : 'Hoàn Tất Nhập Hàng & Cộng Kho'}
                        </button>
                    </div>
                </div>

                {/* BẢNG LỊCH SỬ ĐƠN NHẬP HÀNG KHO (CÓ BỘ LỌC THEO MÃ NCC) */}
                <div class="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-6 shadow-xl backdrop-blur-md">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4 pb-3 border-b border-slate-800">
                        <div>
                            <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">Lịch Sử Nhập Hàng Kho</h3>
                            <span class="text-[11px] text-slate-500">Hiển thị {displayOrders.length} / {importOrders.length} đơn</span>
                        </div>

                        {/* FORM LỌC THEO MÃ NHÀ CUNG CẤP */}
                        <form onSubmit={handleFilter} class="flex items-center gap-2">
                            <input
                                type="number"
                                min="1"
                                placeholder="Nhập ID NCC để lọc..."
                                value={filterSupplierId}
                                onChange={(e) => setFilterSupplierId(e.target.value)}
                                class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 placeholder-slate-600 focus:outline-none focus:border-blue-500 w-44"
                            />
                            <button
                                type="submit"
                                class="bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-xl px-3 py-1.5 text-xs transition-colors"
                            >
                                Lọc
                            </button>
                            {filteredOrders !== null && (
                                <button
                                    type="button"
                                    onClick={handleResetFilter}
                                    class="bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-slate-200 rounded-xl px-3 py-1.5 text-xs transition-colors"
                                >
                                    Xóa Lọc
                                </button>
                            )}
                        </form>
                    </div>

                    <div class="max-h-80 overflow-y-auto custom-scrollbar">
                        <table class="w-full text-left text-xs">
                            <thead class="sticky top-0 bg-slate-900 border-b border-slate-800 text-slate-400">
                            <tr>
                                <th class="pb-3 px-3">Mã Đơn</th>
                                <th class="pb-3 px-3">Nhà Cung Cấp</th>
                                <th class="pb-3 px-3">NV Nhập Kho</th>
                                <th class="pb-3 px-3">Ngày Nhập</th>
                                <th class="pb-3 px-3">Tổng Giá Trị</th>
                                <th class="pb-3 px-3 text-right">Chi Tiết</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50">
                            {displayOrders.length === 0 ? (
                                <tr>
                                    <td colSpan="6" class="py-6 text-center text-slate-500 italic">
                                        Không tìm thấy đơn nhập hàng nào phù hợp.
                                    </td>
                                </tr>
                            ) : (
                                displayOrders.map((imp, idx) => {
                                    const id = Array.isArray(imp) ? imp[0] : (imp.id || imp.importId);
                                    const supName = Array.isArray(imp) ? imp[1] : (imp.supplierName || 'N/A');
                                    const empName = Array.isArray(imp) ? imp[2] : (imp.employeeName || 'N/A');
                                    const date = Array.isArray(imp) ? imp[3] : (imp.createdAt || 'N/A');
                                    const total = Array.isArray(imp) ? imp[4] : (imp.totalAmount || 0);

                                    return (
                                        <tr key={idx} class="hover:bg-slate-800/30 transition-colors">
                                            <td class="py-3 px-3 font-bold text-blue-400">#NH00{id}</td>
                                            <td class="py-3 px-3 text-slate-300 font-medium">{supName}</td>
                                            <td class="py-3 px-3 text-slate-400">{empName}</td>
                                            <td class="py-3 px-3 text-slate-400">{date}</td>
                                            <td class="py-3 px-3 font-bold text-emerald-400">
                                                {typeof total === 'number' ? `${total.toLocaleString('vi-VN')} ₫` : total}
                                            </td>
                                            <td class="py-3 px-3 text-right">
                                                <button
                                                    onClick={() => handleViewDetails(id)}
                                                    class="bg-blue-950 text-blue-400 hover:bg-blue-900 border border-blue-800/80 px-2.5 py-1 rounded-lg text-[10px] font-semibold transition-colors"
                                                >
                                                    Xem Chi Tiết
                                                </button>
                                            </td>
                                        </tr>
                                    );
                                })
                            )}
                            </tbody>
                        </table>
                    </div>
                </div>

                {/* MODAL CHI TIẾT ĐƠN NHẬP HÀNG */}
                {selectedOrder && (
                    <div class="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
                        <div class="bg-slate-900 border border-slate-800 rounded-2xl w-full max-w-xl p-6 shadow-2xl space-y-4">
                            <div class="flex items-center justify-between pb-3 border-b border-slate-800">
                                <h4 class="text-sm font-bold text-slate-200">Chi Tiết Đơn Nhập Hàng Kho #NH00{selectedOrder}</h4>
                                <button
                                    onClick={() => setSelectedOrder(null)}
                                    class="text-slate-400 hover:text-white text-lg font-bold"
                                >
                                    ✕
                                </button>
                            </div>

                            {loadingDetails ? (
                                <div class="py-8 text-center text-slate-400 text-xs">Đang tải chi tiết đơn nhập...</div>
                            ) : (
                                <div class="overflow-x-auto max-h-60 custom-scrollbar">
                                    <table class="w-full text-left text-xs">
                                        <thead class="bg-slate-950 text-slate-400 sticky top-0">
                                        <tr>
                                            <th class="py-2 px-3">Tên Sản Phẩm</th>
                                            <th class="py-2 px-3">Số Lượng</th>
                                            <th class="py-2 px-3">Đơn Giá Nhập</th>
                                            <th class="py-2 px-3">Thành Tiền</th>
                                        </tr>
                                        </thead>
                                        <tbody class="divide-y divide-slate-800/50">
                                        {orderDetails.map((detail, dIdx) => {
                                            const pName = Array.isArray(detail) ? detail[0] : detail.productName;
                                            const qty = Array.isArray(detail) ? detail[1] : detail.quantity;
                                            const price = Array.isArray(detail) ? detail[2] : detail.importPrice;
                                            const subtotal = Array.isArray(detail) ? detail[3] : detail.subtotal;

                                            return (
                                                <tr key={dIdx} class="hover:bg-slate-800/30">
                                                    <td class="py-2.5 px-3 text-slate-200 font-medium">{pName}</td>
                                                    <td class="py-2.5 px-3 text-emerald-400 font-bold">+{qty}</td>
                                                    <td class="py-2.5 px-3 text-slate-300">{price}</td>
                                                    <td class="py-2.5 px-3 font-bold text-blue-400">{subtotal}</td>
                                                </tr>
                                            );
                                        })}
                                        </tbody>
                                    </table>
                                </div>
                            )}

                            <div class="flex justify-end pt-3 border-t border-slate-800">
                                <button
                                    onClick={() => setSelectedOrder(null)}
                                    class="bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold px-4 py-2 rounded-xl text-xs transition-colors"
                                >
                                    Đóng
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // --- MODULE 7: THỐNG KÊ DOANH THU & BÁO CÁO KHO---

    // --- MODULE 7: THỐNG KÊ DOANH THU & BÁO CÁO KHO (TÍNH TỔNG CẢ NĂM) ---
    function ReportView() {
        const [month, setMonth] = React.useState(10);
        const [year, setYear] = React.useState(2026);

        // States chứa dữ liệu
        const [monthlyData, setMonthlyData] = React.useState(["10/2026", "0 VNĐ", "0 VNĐ", "0 VNĐ"]);
        const [yearlyList, setYearlyList] = React.useState([]);
        const [topProducts, setTopProducts] = React.useState([]);
        const [employeeSales, setEmployeeSales] = React.useState([]);
        const [lowStock, setLowStock] = React.useState([]);
        const [loading, setLoading] = React.useState(false);

        // Hàm chuyển đổi chuỗi "166,250,000 VNĐ" về dạng số để cộng dồn
        const parseVndToNumber = (str) => {
            if (!str) return 0;
            // Xóa tất cả ký tự không phải là số hoặc dấu trừ
            const clean = String(str).replace(/[^0-9-]/g, '');
            return parseFloat(clean) || 0;
        };

        // Tính tổng cộng cả năm từ mảng 12 tháng
        const yearlyTotals = React.useMemo(() => {
            let totalRev = 0;
            let totalCost = 0;
            let totalProfit = 0;

            yearlyList.forEach(row => {
                // row[1]: Doanh Thu, row[2]: Chi Phí, row[3]: Lợi Nhuận
                totalRev += parseVndToNumber(row[1]);
                totalCost += parseVndToNumber(row[2]);
                totalProfit += parseVndToNumber(row[3]);
            });

            return {
                revenue: totalRev.toLocaleString('vi-VN') + ' VNĐ',
                cost: totalCost.toLocaleString('vi-VN') + ' VNĐ',
                profit: totalProfit.toLocaleString('vi-VN') + ' VNĐ',
                rawProfit: totalProfit
            };
        }, [yearlyList]);

        // Xử lý thay đổi năm an toàn
        const handleYearChange = (e) => {
            const val = parseInt(e.target.value, 10);
            if (!isNaN(val)) {
                setYear(val);
            } else if (e.target.value === '') {
                setYear('');
            }
        };

        // Đồng bộ gọi toàn bộ API báo cáo
        const fetchAllReports = async () => {
            if (!year || year < 2000) return;
            setLoading(true);
            try {
                const [resMonthly, resYearly, resTop, resEmp, resLow] = await Promise.all([
                    fetch(`/api/reports/monthly?month=${month}&year=${year}`).then(r => r.ok ? r.json() : null),
                    fetch(`/api/reports/yearly?year=${year}`).then(r => r.ok ? r.json() : []),
                    fetch(`/api/reports/top-selling`).then(r => r.ok ? r.json() : []),
                    fetch(`/api/reports/employees?year=${year}`).then(r => r.ok ? r.json() : []),
                    fetch(`/api/reports/low-stock?threshold=3`).then(r => r.ok ? r.json() : [])
                ]);

                if (resMonthly && resMonthly.success && resMonthly.data) {
                    setMonthlyData(resMonthly.data);
                }
                if (resYearly) setYearlyList(resYearly);
                if (resTop) setTopProducts(resTop);
                if (resEmp) setEmployeeSales(resEmp);
                if (resLow) setLowStock(resLow);
            } catch (err) {
                console.error("Lỗi kết nối API Báo cáo:", err);
            } finally {
                setLoading(false);
            }
        };

        React.useEffect(() => {
            fetchAllReports();
        }, [month, year]);

        return (
            <div class="space-y-6">
                {/* 1. Thanh Bộ Lọc Thời Gian */}
                <div class="flex flex-col sm:flex-row items-center justify-between gap-4 bg-slate-900/50 border border-slate-800/80 p-4 rounded-2xl shadow-xl backdrop-blur-md">
                    <div class="flex items-center gap-2">
                        <div class="w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse"></div>
                        <h3 class="text-xs font-bold text-slate-200 uppercase tracking-wider">Thống Kê Báo Cáo Doanh Thu & Kho</h3>
                    </div>

                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-2">
                            <label class="text-xs text-slate-400 font-medium">Tháng:</label>
                            <select
                                value={month}
                                onChange={(e) => setMonth(Number(e.target.value))}
                                class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500"
                            >
                                {[...Array(12)].map((_, i) => (
                                    <option key={i + 1} value={i + 1}>Tháng {i + 1}</option>
                                ))}
                            </select>
                        </div>

                        <div class="flex items-center gap-2">
                            <label class="text-xs text-slate-400 font-medium">Năm:</label>
                            <input
                                type="number"
                                min="2000"
                                max="2099"
                                value={year}
                                onChange={handleYearChange}
                                class="w-24 bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-blue-500 text-center font-mono"
                            />
                        </div>

                        <button
                            onClick={fetchAllReports}
                            class="bg-blue-600 hover:bg-blue-500 text-white rounded-xl px-3.5 py-1.5 text-xs font-semibold transition-colors flex items-center gap-1.5 shadow-lg shadow-blue-600/20"
                        >
                            {loading ? 'Đang Tải...' : 'Làm Mới'}
                        </button>
                    </div>
                </div>

                {/* 2. THẺ TỔNG QUAN TÀI CHÍNH (HIỂN THỊ CẢ THÁNG VÀ TỔNG CẢ NĂM) */}
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    {/* Doanh Thu */}
                    <div class="bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl shadow-xl backdrop-blur-md">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-400 uppercase">Doanh Thu ({monthlyData[0]})</span>
                            <span class="text-[10px] text-slate-500 font-medium">Tổng Cả Năm {year}</span>
                        </div>
                        <div class="text-2xl font-bold text-emerald-400 mt-2">{monthlyData[1]}</div>
                        <div class="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between text-xs">
                            <span class="text-slate-400">Cả Năm {year}:</span>
                            <span class="font-bold text-emerald-300">{yearlyTotals.revenue}</span>
                        </div>
                    </div>

                    {/* Chi Phí */}
                    <div class="bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl shadow-xl backdrop-blur-md">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-400 uppercase">Chi Phí Nhập ({monthlyData[0]})</span>
                            <span class="text-[10px] text-slate-500 font-medium">Tổng Cả Năm {year}</span>
                        </div>
                        <div class="text-2xl font-bold text-amber-400 mt-2">{monthlyData[2]}</div>
                        <div class="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between text-xs">
                            <span class="text-slate-400">Cả Năm {year}:</span>
                            <span class="font-bold text-amber-300">{yearlyTotals.cost}</span>
                        </div>
                    </div>

                    {/* Lợi Nhuận */}
                    <div class="bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl shadow-xl backdrop-blur-md">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-semibold text-slate-400 uppercase">Lợi Nhuận ({monthlyData[0]})</span>
                            <span class="text-[10px] text-slate-500 font-medium">Tổng Cả Năm {year}</span>
                        </div>
                        <div class="text-2xl font-bold text-blue-400 mt-2">{monthlyData[3]}</div>
                        <div class="mt-3 pt-2 border-t border-slate-800/60 flex items-center justify-between text-xs">
                            <span class="text-slate-400">Cả Năm {year}:</span>
                            <span class={`font-bold ${yearlyTotals.rawProfit >= 0 ? 'text-blue-300' : 'text-rose-400'}`}>
                            {yearlyTotals.profit}
                        </span>
                        </div>
                    </div>
                </div>

                {/* 3. Bảng Chi Tiết 12 Tháng Theo Năm */}
                <div class="bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl shadow-xl backdrop-blur-md">
                    <h4 class="text-xs font-bold text-slate-300 uppercase mb-4 pb-2 border-b border-slate-800 flex items-center justify-between">
                        <span>📊 Chi Tiết Doanh Thu & Lợi Nhuận 12 Tháng (Năm {year})</span>
                        <span class="text-[11px] text-slate-500 font-normal">Tự động tổng hợp</span>
                    </h4>
                    <div class="overflow-x-auto max-h-64 custom-scrollbar">
                        <table class="w-full text-left text-xs">
                            <thead class="sticky top-0 bg-slate-950 text-slate-400">
                            <tr>
                                <th class="p-2.5">Thời Gian</th>
                                <th class="p-2.5">Doanh Thu Bán Hàng</th>
                                <th class="p-2.5">Chi Phí Nhập Kho</th>
                                <th class="p-2.5 text-right">Lợi Nhuận Ròng</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50">
                            {yearlyList.length === 0 ? (
                                <tr><td colSpan="4" class="py-6 text-center text-slate-500 italic">Chưa có dữ liệu theo năm</td></tr>
                            ) : (
                                yearlyList.map((row, idx) => (
                                    <tr key={idx} class="hover:bg-slate-800/30 transition-colors">
                                        <td class="p-2.5 font-bold text-slate-300">{row[0]}</td>
                                        <td class="p-2.5 font-semibold text-emerald-400">{row[1]}</td>
                                        <td class="p-2.5 font-semibold text-amber-400">{row[2]}</td>
                                        <td class="p-2.5 text-right font-bold text-blue-400">{row[3]}</td>
                                    </tr>
                                ))
                            )}
                            </tbody>
                        </table>
                    </div>
                </div>

                {/* 4. Grid Top 5 Bán Chạy & Doanh Số Nhân Viên */}
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                    <div class="bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl shadow-xl backdrop-blur-md">
                        <h4 class="text-xs font-bold text-slate-300 uppercase mb-4 pb-2 border-b border-slate-800 flex items-center justify-between">
                            <span>🔥 Top 5 Sản Phẩm Bán Chạy Nhất</span>
                        </h4>
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-950 text-slate-400">
                                <tr>
                                    <th class="p-2.5">Hạng</th>
                                    <th class="p-2.5">Mã SP</th>
                                    <th class="p-2.5">Tên Sản Phẩm</th>
                                    <th class="p-2.5">Đã Bán</th>
                                    <th class="p-2.5 text-right">Doanh Thu</th>
                                </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/50">
                                {topProducts.length === 0 ? (
                                    <tr><td colSpan="5" class="py-6 text-center text-slate-500 italic">Chưa có dữ liệu bán hàng</td></tr>
                                ) : (
                                    topProducts.map((p, i) => (
                                        <tr key={i} class="hover:bg-slate-800/30 transition-colors">
                                            <td class="p-2.5 font-bold text-amber-400">{p[0]}</td>
                                            <td class="p-2.5 text-slate-400">#{p[1]}</td>
                                            <td class="p-2.5 font-medium text-slate-200">{p[2]}</td>
                                            <td class="p-2.5 font-bold text-emerald-400">{p[3]}</td>
                                            <td class="p-2.5 text-right font-bold text-blue-400">{p[4]}</td>
                                        </tr>
                                    ))
                                )}
                                </tbody>
                            </table>
                        </div>
                    </div>

                    <div class="bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl shadow-xl backdrop-blur-md">
                        <h4 class="text-xs font-bold text-slate-300 uppercase mb-4 pb-2 border-b border-slate-800">
                            👨‍💼 Doanh Số Theo Nhân Viên (Năm {year})
                        </h4>
                        <div class="overflow-x-auto custom-scrollbar">
                            <table class="w-full text-left text-xs">
                                <thead class="bg-slate-950 text-slate-400">
                                <tr>
                                    <th class="p-2.5">Mã NV</th>
                                    <th class="p-2.5">Tên Nhân Viên</th>
                                    <th class="p-2.5">Số Hóa Đơn</th>
                                    <th class="p-2.5 text-right">Tổng Doanh Số</th>
                                </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-800/50">
                                {employeeSales.length === 0 ? (
                                    <tr><td colSpan="4" class="py-6 text-center text-slate-500 italic">Chưa có dữ liệu nhân viên</td></tr>
                                ) : (
                                    employeeSales.map((emp, i) => (
                                        <tr key={i} class="hover:bg-slate-800/30 transition-colors">
                                            <td class="p-2.5 font-bold text-slate-400">#{emp[0]}</td>
                                            <td class="p-2.5 font-medium text-slate-200">{emp[1]}</td>
                                            <td class="p-2.5 font-semibold text-slate-300">{emp[2]}</td>
                                            <td class="p-2.5 text-right font-bold text-emerald-400">{emp[3]}</td>
                                        </tr>
                                    ))
                                )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                {/* 5. Cảnh Báo Tồn Kho Thấp (<= 3) */}
                <div class="bg-slate-900/50 border border-slate-800/80 p-5 rounded-2xl shadow-xl backdrop-blur-md">
                    <h4 class="text-xs font-bold text-rose-400 uppercase mb-4 pb-2 border-b border-slate-800 flex items-center justify-between">
                        <span>⚠️ Cảnh Báo Sản Phẩm Tồn Kho Thấp (≤ 3)</span>
                        <span class="text-[11px] text-slate-500 font-normal">Tự động quét CSDL</span>
                    </h4>
                    <div class="overflow-x-auto custom-scrollbar">
                        <table class="w-full text-left text-xs">
                            <thead class="bg-slate-950 text-slate-400">
                            <tr>
                                <th class="p-2.5">Mã SP</th>
                                <th class="p-2.5">Tên Sản Phẩm</th>
                                <th class="p-2.5">Hãng</th>
                                <th class="p-2.5">Tồn Kho Hiện Tại</th>
                                <th class="p-2.5 text-right">Giá Bán</th>
                            </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-800/50">
                            {lowStock.length === 0 ? (
                                <tr><td colSpan="5" class="py-6 text-center text-emerald-400 font-medium italic">Tất cả sản phẩm trong kho đều ở mức an toàn (&gt; 3 sản phẩm)!</td></tr>
                            ) : (
                                lowStock.map((prod, i) => (
                                    <tr key={i} class="hover:bg-slate-800/30 transition-colors">
                                        <td class="p-2.5 font-bold text-slate-400">#{prod[0]}</td>
                                        <td class="p-2.5 font-medium text-slate-200">{prod[1]}</td>
                                        <td class="p-2.5 text-slate-400">{prod[2]}</td>
                                        <td class="p-2.5 font-bold text-rose-400">{prod[3]} sản phẩm</td>
                                        <td class="p-2.5 text-right text-slate-300">{prod[4]}</td>
                                    </tr>
                                ))
                            )}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
