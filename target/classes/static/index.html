<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile Store Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased selection:bg-blue-500 selection:text-white">
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
        // Auth State
        const [isAuthenticated, setIsAuthenticated] = useState(false);
        const [currentUser, setCurrentUser] = useState(null);

        // Navigation State
        const [activeTab, setActiveTab] = useState('dashboard');
        const [notification, setNotification] = useState(null);

        // Data States lấy trực tiếp từ Spring Boot Backend
        const [products, setProducts] = useState([]);
        const [customers, setCustomers] = useState([]);
        const [employees, setEmployees] = useState([]);
        const [suppliers, setSuppliers] = useState([]);
        const [invoices, setInvoices] = useState([]);
        const [importOrders, setImportOrders] = useState([]);

        // Form States cho từng Module
        const [productForm, setProductForm] = useState({ name: '', price: '', stock: '', category: 'Apple' });
        const [customerForm, setCustomerForm] = useState({ name: '', phone: '', address: '' });
        const [employeeForm, setEmployeeForm] = useState({ name: '', phone: '', role: 'Nhân viên bán hàng', salary: '' });
        const [supplierForm, setSupplierForm] = useState({ supplierName: '', phone: '', email: '', address: '' });
        const [loginForm, setLoginForm] = useState({ username: '', password: '' });

        // POS Cart State
        const [cart, setCart] = useState([]);

        // Tự động render Icon Lucide khi đổi Tab hoặc dữ liệu cập nhật
        useEffect(() => {
            if (window.lucide) {
                window.lucide.createIcons();
            }
        }, [activeTab, isAuthenticated, products, customers, employees, suppliers, invoices, cart]);

        // Đọc dữ liệu từ tất cả Controller khi Đăng nhập thành công
        useEffect(() => {
            if (isAuthenticated) {
                fetchAllDataFromBackend();
            }
        }, [isAuthenticated]);

        const showToast = (msg, type = 'success') => {
            setNotification({ msg, type });
            setTimeout(() => setNotification(null), 3000);
        };

        // GỌI ĐỒNG LOẠT REST API TỪ TOÀN BỘ CONTROLLER BACKEND
        const fetchAllDataFromBackend = async () => {
            try {
                const [resP, resC, resE, resS, resI, resImp] = await Promise.all([
                    fetch('/api/products').catch(() => null),
                    fetch('/api/customers').catch(() => null),
                    fetch('/api/employees').catch(() => null),
                    fetch('/api/suppliers').catch(() => null),
                    fetch('/api/invoices').catch(() => null),
                    fetch('/api/import-orders').catch(() => null)
                ]);

                if (resP && resP.ok) setProducts(await resP.json());
                if (resC && resC.ok) setCustomers(await resC.json());
                if (resE && resE.ok) setEmployees(await resE.json());
                if (resS && resS.ok) setSuppliers(await resS.json());
                if (resI && resI.ok) setInvoices(await resI.json());
                if (resImp && resImp.ok) setImportOrders(await resImp.json());
            } catch (err) {
                console.error("Lỗi khi tải dữ liệu từ API Backend:", err);
            }
        };

        // Handler Đăng Nhập gọi AuthController
        const handleLogin = async (e) => {
            e.preventDefault();

            // Reset thông báo lỗi cũ nếu có
            const alertBox = document.getElementById('errorAlert');
            const alertText = document.getElementById('errorAlertText');
            if (alertBox) alertBox.style.display = 'none';

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(loginForm)
                });

                const data = await res.json();

                // 1. ĐĂNG NHẬP THÀNH CÔNG
                if (res.ok && data.success === true) {
                    // Hiển thị toast thông báo thành công nếu có hàm showToast
                    if (typeof showToast === 'function') {
                        showToast(data.message || 'Đăng nhập hệ thống thành công!', 'success');
                    } else {
                        alert(data.message || 'Đăng nhập hệ thống thành công!');
                    }

                    // Chuyển sang trạng thái đã xác thực
                    setIsAuthenticated(true);
                    setCurrentUser(data.username || loginForm.username);
                }
                // 2. ĐĂNG NHẬP THẤT BẠI (Nhập sai tài khoản / mật khẩu)
                else {
                    setIsAuthenticated(false);
                    const msg = data.message || 'Tên đăng nhập hoặc mật khẩu không chính xác!';

                    if (alertBox && alertText) {
                        alertText.innerText = msg;
                        alertBox.style.display = 'block';
                    } else if (typeof showToast === 'function') {
                        showToast(msg, 'error');
                    } else {
                        alert(msg);
                    }
                }
            } catch (err) {
                console.error('Lỗi kết nối API:', err);
                setIsAuthenticated(false);
                if (alertBox && alertText) {
                    alertText.innerText = 'Không thể kết nối đến máy chủ Backend!';
                    alertBox.style.display = 'block';
                } else {
                    alert('Không thể kết nối đến máy chủ Backend!');
                }
            }
        };

        const handleLogout = () => {
            setIsAuthenticated(false);
            setCurrentUser(null);
            showToast('Đã đăng xuất tài khoản', 'info');
        };

        // --- MÀN HÌNH ĐĂNG NHẬP ---
        if (!isAuthenticated) {
            return (
                <div class="min-h-screen flex items-center justify-center bg-slate-950 p-4 relative overflow-hidden">
                    <div class="absolute -top-40 -left-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>
                    <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>

                    <div class="w-full max-w-md bg-slate-900/60 backdrop-blur-2xl border border-slate-800/80 p-8 rounded-3xl shadow-2xl relative z-10">
                        <div class="flex flex-col items-center mb-8">
                            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30 mb-3">
                                <i data-lucide="smartphone" class="w-8 h-8 text-white"></i>
                            </div>
                            <h1 class="text-xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">MOBILE STORE</h1>
                            <p class="text-xs text-slate-400 mt-1">Đăng nhập hệ thống quản lý cửa hàng</p>
                        </div>

                        <form onSubmit={handleLogin} class="space-y-4">
                            {/* Thẻ thông báo lỗi giao diện Dark Mode chuẩn React JSX */}
                            <div id="errorAlert" style={{ display: 'none' }} className="p-3 bg-red-500/20 border border-red-500/50 text-red-300 rounded-xl text-xs text-center font-medium transition-all duration-300">
                                <span id="errorAlertText">Tên đăng nhập hoặc mật khẩu không chính xác!</span>
                            </div>
                            <div>
                                <label class="text-xs text-slate-400 mb-1.5 block font-medium">Tài khoản</label>
                                <div class="relative">
                                    <input
                                        type="text"
                                        required
                                        placeholder="Nhập username..."
                                        value={loginForm.username}
                                        onChange={e => setLoginForm({...loginForm, username: e.target.value})}
                                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 pl-10 text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                                    />
                                    <i data-lucide="user" class="w-4 h-4 text-slate-500 absolute left-3 top-3"></i>
                                </div>
                            </div>

                            <div>
                                <label class="text-xs text-slate-400 mb-1.5 block font-medium">Mật khẩu</label>
                                <div class="relative">
                                    <input
                                        type="password"
                                        required
                                        placeholder="••••••••"
                                        value={loginForm.password}
                                        onChange={e => setLoginForm({...loginForm, password: e.target.value})}
                                        class="w-full bg-slate-950/80 border border-slate-800 rounded-xl px-4 py-2.5 pl-10 text-xs text-slate-100 focus:outline-none focus:border-blue-500"
                                    />
                                    <i data-lucide="lock" class="w-4 h-4 text-slate-500 absolute left-3 top-3"></i>
                                </div>
                            </div>

                            <button
                                type="submit"
                                class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-2.5 rounded-xl text-xs transition shadow-lg shadow-blue-600/30 flex items-center justify-center gap-2 mt-2"
                            >
                                <span>Vào Hệ Thống</span>
                                <i data-lucide="arrow-right" class="w-4 h-4"></i>
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- GIAO DIỆN CHÍNH ---
        return (
            <div class="flex h-screen overflow-hidden bg-slate-950 text-slate-100">
                {/* TOAST NOTIFICATION */}
                {notification && (
                    <div class={`fixed top-4 right-4 z-50 px-4 py-3 rounded-xl border backdrop-blur-xl text-xs font-semibold shadow-xl flex items-center gap-2 ${
                        notification.type === 'error' ? 'bg-rose-950/80 border-rose-800 text-rose-300' : 'bg-emerald-950/80 border-emerald-800 text-emerald-300'
                    }`}>
                        <i data-lucide={notification.type === 'error' ? 'alert-circle' : 'check-circle-2'} class="w-4 h-4"></i>
                        {notification.msg}
                    </div>
                )}

                {/* SIDEBAR NAVIGATION */}
                <aside class="w-72 bg-slate-900/60 backdrop-blur-xl border-r border-slate-800/80 flex flex-col justify-between p-4">
                    <div>
                        <div class="flex items-center gap-3 px-3 py-4 border-b border-slate-800/80 mb-4">
                            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center shadow-lg shadow-blue-500/30">
                                <i data-lucide="smartphone" class="w-6 h-6 text-white"></i>
                            </div>
                            <div>
                                <h1 class="font-bold text-base tracking-wide bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">MOBILE STORE</h1>
                                <span class="text-[10px] text-blue-400 font-medium uppercase tracking-wider">Management System</span>
                            </div>
                        </div>

                        <nav class="space-y-1">
                            <NavItem id="dashboard" icon="layout-dashboard" label="Trang Chủ Dashboard" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="product" icon="package" label="1. Quản Lý Sản Phẩm" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="customer" icon="users" label="2. Quản Lý Khách Hàng" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="employee" icon="user-cog" label="3. Quản Lý Nhân Viên" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="supplier" icon="building-2" label="4. Nhà Cung Cấp" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="invoice" icon="receipt" label="5. Bán Hàng (Hóa Đơn)" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="import" icon="file-input" label="6. Nhập Hàng Kho" active={activeTab} onClick={setActiveTab} />
                            <NavItem id="report" icon="bar-chart-3" label="7. Thống Kê Doanh Thu" active={activeTab} onClick={setActiveTab} />
                        </nav>
                    </div>

                    <div class="space-y-3">
                        <div class="p-3 bg-slate-900/80 rounded-xl border border-slate-800 flex items-center justify-between">
                            <div class="flex items-center gap-2">
                                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-ping"></span>
                                <span class="text-xs font-medium text-emerald-400">localhost:8080</span>
                            </div>
                            <span class="text-[10px] bg-slate-800 text-slate-400 px-2 py-0.5 rounded-md border border-slate-700">Spring Boot REST</span>
                        </div>

                        <button
                            onClick={handleLogout}
                            class="w-full flex items-center justify-center gap-2 py-2 px-3 rounded-xl bg-slate-900 hover:bg-rose-950/40 text-slate-400 hover:text-rose-400 border border-slate-800 hover:border-rose-900/50 text-xs font-semibold transition"
                        >
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                            <span>Đăng Xuất ({currentUser})</span>
                        </button>
                    </div>
                </aside>

                {/* MAIN CONTENT ROUTING GỌI REST API */}
                <main class="flex-1 flex flex-col overflow-hidden bg-slate-950">
                    <header class="h-16 border-b border-slate-800/80 px-8 flex items-center justify-between bg-slate-900/30 backdrop-blur-md">
                        <h2 class="text-lg font-semibold text-slate-200 flex items-center gap-2">
                            {activeTab === 'dashboard' && '📊 Dashboard Tổng Quan Cửa Hàng'}
                            {activeTab === 'product' && '📱 Module 1: Quản Lý Sản Phẩm (REST API /api/products)'}
                            {activeTab === 'customer' && '👥 Module 2: Quản Lý Khách Hàng (REST API /api/customers)'}
                            {activeTab === 'employee' && '👔 Module 3: Quản Lý Nhân Viên (REST API /api/employees)'}
                            {activeTab === 'supplier' && '🏭 Module 4: Nhà Cung Cấp (REST API /api/suppliers)'}
                            {activeTab === 'invoice' && '🛒 Module 5: Bán Hàng & POS Hóa Đơn (REST API /api/invoices)'}
                            {activeTab === 'import' && '📦 Module 6: Quản Lý Nhập Hàng Kho (REST API /api/imports)'}
                            {activeTab === 'report' && '📈 Module 7: Thống Kê & Báo Cáo Doanh Thu'}
                        </h2>

                        <div class="flex items-center gap-2 bg-slate-900 border border-slate-800 px-3 py-1.5 rounded-xl">
                            <div class="w-6 h-6 rounded-full bg-blue-600/30 border border-blue-500/50 text-blue-400 flex items-center justify-center font-bold text-[10px]">
                                {currentUser?.charAt(0).toUpperCase()}
                            </div>
                            <span class="text-xs font-medium text-slate-300">{currentUser}</span>
                        </div>
                    </header>

                    <div class="flex-1 p-8 overflow-y-auto">
                        {activeTab === 'dashboard' && <DashboardView />}
                        {activeTab === 'product' && <ProductView products={products} refresh={fetchAllDataFromBackend} form={productForm} setForm={setProductForm} showToast={showToast} />}
                        {activeTab === 'customer' && <CustomerView customers={customers} refresh={fetchAllDataFromBackend} form={customerForm} setForm={setCustomerForm} showToast={showToast} />}
                        {activeTab === 'employee' && <EmployeeView employees={employees} refresh={fetchAllDataFromBackend} form={employeeForm} setForm={setEmployeeForm} showToast={showToast} />}
                        {activeTab === 'supplier' && <SupplierView suppliers={suppliers} refresh={fetchAllDataFromBackend} form={supplierForm} setForm={setSupplierForm} showToast={showToast} />}
                        {activeTab === 'invoice' && <InvoicePOSView products={products} cart={cart} setCart={setCart} invoices={invoices} refresh={fetchAllDataFromBackend} showToast={showToast} />}
                        {activeTab === 'import' && <ImportView importOrders={importOrders} onRefreshData={fetchAllDataFromBackend} showToast={showToast} />}
                        {activeTab === 'report' && <ReportView />}
                    </div>
                </main>
            </div>
        );
    }

    function NavItem({ id, icon, label, active, onClick }) {
        const isActive = active === id;
        return (
            <button
                onClick={() => onClick(id)}
                class={`w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium transition-all ${
                    isActive
                        ? 'bg-blue-600 text-white shadow-lg shadow-blue-600/25'
                        : 'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200'
                }`}
            >
                <div class="flex items-center gap-2.5">
                    <i data-lucide={icon} class="w-4 h-4"></i>
                    <span>{label}</span>
                </div>
            </button>
        );
    }

    // --- DASHBOARD TỔNG QUAN (DỮ LIỆU THỰC TẾ & GIAO DIỆN SÁNG SỦA) ---
    // --- DASHBOARD TỔNG QUAN (ĐÃ FIX LỖI HIỂN THỊ TỔNG TIỀN HÓA ĐƠN) ---
    function DashboardView({ products = [], customers = [], invoices = [], importOrders = [] }) {
        const currentYear = new Date().getFullYear();
        const [yearlyReport, setYearlyReport] = React.useState([]);
        const [loadingChart, setLoadingChart] = React.useState(true);

        // States dữ liệu tự fetch
        const [localProducts, setLocalProducts] = React.useState(products);
        const [localCustomers, setLocalCustomers] = React.useState(customers);
        const [localInvoices, setLocalInvoices] = React.useState(invoices);
        const [localImports, setLocalImports] = React.useState(importOrders);

        React.useEffect(() => {
            fetch(`/api/reports/yearly?year=${currentYear}`)
                .then(res => res.ok ? res.json() : [])
                .then(data => {
                    setYearlyReport(data);
                    setLoadingChart(false);
                })
                .catch(err => {
                    console.error("Lỗi tải biểu đồ Dashboard:", err);
                    setLoadingChart(false);
                });

            if (products.length === 0) {
                fetch('/api/products').then(r => r.ok ? r.json() : []).then(d => setLocalProducts(d)).catch(()=>{});
            } else {
                setLocalProducts(products);
            }

            if (customers.length === 0) {
                fetch('/api/customers').then(r => r.ok ? r.json() : []).then(d => setLocalCustomers(d)).catch(()=>{});
            } else {
                setLocalCustomers(customers);
            }

            if (invoices.length === 0) {
                fetch('/api/invoices').then(r => r.ok ? r.json() : []).then(d => setLocalInvoices(d)).catch(()=>{});
            } else {
                setLocalInvoices(invoices);
            }

            if (importOrders.length === 0) {
                fetch('/api/import-orders').then(r => r.ok ? r.json() : []).then(d => setLocalImports(d)).catch(()=>{});
            } else {
                setLocalImports(importOrders);
            }
        }, [currentYear, products.length, customers.length, invoices.length, importOrders.length]);

        const parseVndToNum = (str) => {
            if (!str) return 0;
            const clean = String(str).replace(/[^0-9-]/g, '');
            return parseFloat(clean) || 0;
        };

        // 1. Tổng doanh thu từ báo cáo 12 tháng
        const totalRevenueReal = React.useMemo(() => {
            if (!yearlyReport.length) return 0;
            return yearlyReport.reduce((sum, row) => sum + parseVndToNum(row[1]), 0);
        }, [yearlyReport]);

        // 2. Tổng máy trong kho
        const totalStockReal = React.useMemo(() => {
            return localProducts.reduce((sum, prod) => {
                const stock = Array.isArray(prod) ? prod[4] : (prod.stock || 0);
                return sum + (Number(stock) || 0);
            }, 0);
        }, [localProducts]);

        // Max doanh thu biểu đồ
        const maxMonthlyRev = React.useMemo(() => {
            if (!yearlyReport.length) return 1;
            const revs = yearlyReport.map(r => parseVndToNum(r[1]));
            const max = Math.max(...revs);
            return max > 0 ? max : 1;
        }, [yearlyReport]);

        // 5 Hóa đơn mới nhất
        const recentInvoices = React.useMemo(() => {
            return [...localInvoices].slice(-5).reverse();
        }, [localInvoices]);

        return (
            <div class="space-y-6">
                {/* 1. 4 THẺ CHỈ SỐ NỔI BẬT */}
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
                    <div class="relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-900/90 to-emerald-950/40 border border-emerald-500/30 p-5 rounded-2xl shadow-lg hover:border-emerald-500/60 transition-all duration-300 group">
                        <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-emerald-500/10 rounded-full blur-xl group-hover:bg-emerald-500/20 transition-all"></div>
                        <div class="flex items-center justify-between relative z-10">
                            <span class="text-xs font-bold text-emerald-400 uppercase tracking-wider">Tổng Doanh Thu Cả Năm</span>
                            <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/30 flex items-center justify-center text-emerald-400 text-lg font-bold shadow-inner">₫</div>
                        </div>
                        <div class="text-xl sm:text-2xl font-extrabold text-white mt-3 tracking-tight relative z-10">
                            {totalRevenueReal.toLocaleString('vi-VN')} VNĐ
                        </div>
                        <div class="mt-2 text-[11px] text-emerald-400/80 font-medium flex items-center gap-1">
                            <span>• Tổng hợp CSDL năm {currentYear}</span>
                        </div>
                    </div>

                    <div class="relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-900/90 to-blue-950/40 border border-blue-500/30 p-5 rounded-2xl shadow-lg hover:border-blue-500/60 transition-all duration-300 group">
                        <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-blue-500/10 rounded-full blur-xl group-hover:bg-blue-500/20 transition-all"></div>
                        <div class="flex items-center justify-between relative z-10">
                            <span class="text-xs font-bold text-blue-400 uppercase tracking-wider">Hóa Đơn Bán Hàng</span>
                            <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/30 flex items-center justify-center text-blue-400 text-base font-bold shadow-inner">🧾</div>
                        </div>
                        <div class="text-2xl font-extrabold text-white mt-3 tracking-tight relative z-10">
                            {localInvoices.length} <span class="text-xs font-normal text-slate-400">Đơn</span>
                        </div>
                        <div class="mt-2 text-[11px] text-blue-400/80 font-medium flex items-center gap-1">
                            <span>• {localImports.length} Đơn nhập kho</span>
                        </div>
                    </div>

                    <div class="relative overflow-hidden bg-gradient-to-br from-slate-900 via-slate-900/90 to-amber-950/40 border border-amber-500/30 p-5 rounded-2xl shadow-lg hover:border-amber-500/60 transition-all duration-300 group">
                        <div class="absolute -right-4 -bottom-4 w-20 h-20 bg-amber-500/10 rounded-full blur-xl group-hover:bg-amber-500/20 transition-all"></div>
                        <div class="flex items-center justify-between relative z-10">
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">Tổng Máy Trong Kho</span>
                            <div class="w-10 h-10 rounded-xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-amber-400 text-base font-bold shadow-inner">📦</div>
                        </div>
                        <div class="text-2xl font-extrabold text-white mt-3 tracking-tight relative z-10">

    // --- MODULE 1: QUẢN LÝ SẢN PHẨM (GỌI /api/products) ---
    function ProductView({ showToast }) {
        const [products, setProducts] = React.useState([]);
        const [form, setForm] = React.useState({ productName: '', brand: '', price: '', stock: '' });
        const [editingId, setEditingId] = React.useState(null);
        const [searchBrand, setSearchBrand] = React.useState('');

        // State quản lý Modal xác nhận xóa custom
        const [deleteModal, setDeleteModal] = React.useState({ show: false, id: null, name: '' });

        const fetchProducts = async () => {
            try {
                const res = await fetch('/api/products');
                if (res.ok) {
                    const data = await res.json();
                    setProducts(data);
                }
            } catch (err) {
                console.error("Lỗi lấy sản phẩm:", err);
            }
        };

        React.useEffect(() => {
            fetchProducts();
        }, []);

        const handleSave = async (e) => {
            e.preventDefault();
            try {
                const payload = {
                    productName: form.productName,
                    brand: form.brand,
                    price: parseFloat(form.price),
                    stock: parseInt(form.stock, 10)
                };

                const isEdit = editingId !== null;
                const url = isEdit ? `/api/products/${editingId}` : '/api/products';
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.success !== false) {
                    if (typeof showToast === 'function') {
                        showToast(data.message || (isEdit ? 'Cập nhật thành công!' : 'Thêm sản phẩm thành công!'));
                    }
                    setForm({ productName: '', brand: '', price: '', stock: '' });
                    setEditingId(null);
                    fetchProducts();
                } else {
                    const msg = data.message || 'Lỗi xử lý dữ liệu!';
                    if (typeof showToast === 'function') showToast(msg, 'error');
                }
            } catch (err) {
                if (typeof showToast === 'function') showToast('Lỗi kết nối Backend!', 'error');
            }
        };

        const handleEditClick = (p) => {
            setEditingId(p.productId);
            setForm({
                productName: p.productName || '',
                brand: p.brand || '',
                price: p.price || '',
                stock: p.stock || ''
            });
        };

        const handleCancelEdit = () => {
            setEditingId(null);
            setForm({ productName: '', brand: '', price: '', stock: '' });
        };

        // Mở modal xóa custom thay vì confirm()
        const openDeleteModal = (id, name) => {
            setDeleteModal({ show: true, id, name });
        };

        // Thực hiện xóa khi bấm Đồng ý trên Modal
        const confirmDelete = async () => {
            const { id } = deleteModal;
            setDeleteModal({ show: false, id: null, name: '' });

            try {
                const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok && data.success !== false) {
                    if (typeof showToast === 'function') showToast(data.message || 'Xóa sản phẩm thành công!');
                    fetchProducts();
                } else {
                    if (typeof showToast === 'function') showToast(data.message || 'Xóa thất bại!', 'error');
                }
            } catch (err) {
                if (typeof showToast === 'function') showToast('Lỗi kết nối Backend!', 'error');
            }
        };

        const filteredProducts = products.filter(p =>
            !searchBrand || (p.brand && p.brand.toLowerCase().includes(searchBrand.toLowerCase()))
        );

        return (
            <div className="grid grid-cols-3 gap-6 relative">
                {/* DANH SÁCH SẢN PHẨM */}
                <div className="col-span-2 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                            Danh Sách Sản Phẩm (PostgreSQL)
                        </h3>
                        <input
                            type="text"
                            placeholder="🔍 Tìm theo hãng..."
                            value={searchBrand}
                            onChange={(e) => setSearchBrand(e.target.value)}
                            className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1 text-xs text-slate-200 w-48 focus:outline-none focus:border-blue-500"
                        />
                    </div>

                    <table className="w-full text-left text-xs">
                        <thead>
                        <tr className="border-b border-slate-800 text-slate-400">
                            <th className="pb-3 px-2">Mã SP</th>
                            <th className="pb-3 px-2">Tên Sản Phẩm</th>
                            <th className="pb-3 px-2">Hãng</th>
                            <th className="pb-3 px-2">Giá Bán</th>
                            <th className="pb-3 px-2">Tồn Kho</th>
                            <th className="pb-3 px-2 text-center">Thao Tác</th>
                        </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/50">
                        {filteredProducts.length === 0 ? (
                            <tr>
                                <td colSpan="6" className="py-4 text-center text-slate-500">Không có dữ liệu sản phẩm</td>
                            </tr>
                        ) : (
                            filteredProducts.map(p => (
                                <tr key={p.productId} className="hover:bg-slate-800/30 transition">
                                    <td className="py-3 px-2 font-semibold text-slate-400">#{p.productId}</td>
                                    <td className="py-3 px-2 font-bold text-blue-400">{p.productName}</td>
                                    <td className="py-3 px-2">
                                        <span className="bg-slate-800 text-slate-300 px-2 py-0.5 rounded text-[10px]">
                                            {p.brand || 'Khác'}
                                        </span>
                                    </td>
                                    <td className="py-3 px-2 font-semibold text-emerald-400">
                                        {Number(p.price).toLocaleString('vi-VN')} ₫
                                    </td>
                                    <td className="py-3 px-2 text-slate-300">{p.stock} máy</td>
                                    <td className="py-3 px-2 text-center space-x-2">
                                        <button
                                            onClick={() => handleEditClick(p)}
                                            className="px-2 py-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 rounded border border-amber-500/30 text-[11px] transition"
                                        >
                                            ✏️ Sửa
                                        </button>
                                        <button
                                            onClick={() => openDeleteModal(p.productId, p.productName)}
                                            className="px-2 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded border border-red-500/30 text-[11px] transition"
                                        >
                                            🗑️ Xóa
                                        </button>
                                    </td>
                                </tr>
                            ))
                        )}
                        </tbody>
                    </table>
                </div>

                {/* FORM THÊM / SỬA SẢN PHẨM */}
                <div className="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5 h-fit">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                            {editingId ? `Sửa Sản Phẩm #${editingId}` : 'Thêm Sản Phẩm Mới'}
                        </h3>
                        {editingId && (
                            <button onClick={handleCancelEdit} className="text-[10px] text-slate-400 hover:text-white underline">
                                Hủy sửa
                            </button>
                        )}
                    </div>

                    <form onSubmit={handleSave} className="space-y-3">
                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Tên sản phẩm:</label>
                            <input
                                type="text"
                                required
                                placeholder="Nhập tên sản phẩm..."
                                value={form.productName}
                                onChange={e => setForm({...form, productName: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            />
                        </div>

                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Thương hiệu / Hãng:</label>
                            <input
                                type="text"
                                required
                                placeholder="Nhập hãng (VD: Apple, Lenovo...)"
                                value={form.brand}
                                onChange={e => setForm({...form, brand: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            />
                        </div>

                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Giá bán (VNĐ):</label>
                            <input
                                type="number"
                                required
                                placeholder="VD: 15000000"
                                value={form.price}
                                onChange={e => setForm({...form, price: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            />
                        </div>

                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Số lượng nhập kho:</label>
                            <input
                                type="number"
                                required
                                placeholder="VD: 10"
                                value={form.stock}
                                onChange={e => setForm({...form, stock: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            />
                        </div>

                        <button
                            type="submit"
                            className={`w-full font-semibold py-2.5 rounded-xl text-xs transition shadow-lg mt-2 text-white ${
                                editingId
                                    ? 'bg-amber-600 hover:bg-amber-500 shadow-amber-600/20'
                                    : 'bg-blue-600 hover:bg-blue-500 shadow-blue-600/20'
                            }`}
                        >
                            {editingId ? 'Cập Nhật Sản Phẩm' : 'Thêm Sản Phẩm'}
                        </button>
                    </form>
                </div>

                {/* MODAL XÁC NHẬN XÓA XỊN SÒ (DARK MODE MODAL) */}
                {deleteModal.show && (
                    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-fade-in">
                            <div className="w-12 h-12 rounded-full bg-red-500/10 border border-red-500/20 text-red-500 flex items-center justify-center mx-auto mb-4 text-xl">
                                ⚠️
                            </div>
                            <h4 className="text-sm font-bold text-slate-200 text-center mb-2">Xác nhận xóa sản phẩm?</h4>
                            <p className="text-xs text-slate-400 text-center mb-6">
                                Bạn có chắc chắn muốn xóa sản phẩm <span className="text-red-400 font-semibold">"{deleteModal.name}"</span> (Mã #{deleteModal.id}) khỏi hệ thống?
                            </p>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setDeleteModal({ show: false, id: null, name: '' })}
                                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition"
                                >
                                    Hủy bỏ
                                </button>
                                <button
                                    onClick={confirmDelete}
                                    className="flex-1 bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded-xl text-xs transition shadow-lg shadow-red-600/20"
                                >
                                    Đồng ý Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // --- MODULE 2: QUẢN LÝ KHÁCH HÀNG (GỌI /api/customers) ---
    function CustomerView({ showToast }) {
        const [customers, setCustomers] = React.useState([]);
        const [form, setForm] = React.useState({ customerName: '', phone: '', email: '', address: '' });
        const [editingId, setEditingId] = React.useState(null);
        const [searchPhone, setSearchPhone] = React.useState('');

        // State quản lý Modal xác nhận xóa Dark Mode
        const [deleteModal, setDeleteModal] = React.useState({ show: false, id: null, name: '' });

        // 1. Hàm nạp danh sách khách hàng (Có hỗ trợ lọc SĐT từ Backend)
        const fetchCustomers = async (phoneFilter = '') => {
            try {
                const url = phoneFilter.trim()
                    ? `/api/customers?phone=${encodeURIComponent(phoneFilter.trim())}`
                    : '/api/customers';
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    setCustomers(data);
                }
            } catch (err) {
                console.error("Lỗi lấy danh sách khách hàng:", err);
            }
        };

        React.useEffect(() => {
            fetchCustomers();
        }, []);

        // Tự động tìm kiếm khi gõ SĐT
        const handleSearchChange = (e) => {
            const val = e.target.value;
            setSearchPhone(val);
            fetchCustomers(val);
        };

        // 2. Thêm mới hoặc Cập nhật Khách Hàng
        const handleSave = async (e) => {
            e.preventDefault();
            try {
                const payload = {
                    customerName: form.customerName,
                    phone: form.phone,
                    email: form.email,
                    address: form.address
                };

                const isEdit = editingId !== null;
                const url = isEdit ? `/api/customers/${editingId}` : '/api/customers';
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.success !== false) {
                    if (typeof showToast === 'function') {

            try {
                const url = phoneFilter.trim()
                    ? `/api/employees?phone=${encodeURIComponent(phoneFilter.trim())}`
                    : '/api/employees';
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    setEmployees(data);

                console.error("Lỗi lấy danh sách nhân viên:", err);

        // 1. Fetch danh sách nhà cung cấp từ Backend
        const fetchSuppliers = async (phoneFilter = '') => {
            try {
                const url = phoneFilter.trim()
                    ? `/api/suppliers?phone=${encodeURIComponent(phoneFilter.trim())}`
                    : '/api/suppliers';
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    setSuppliers(data);
                }
            } catch (err) {
                console.error("Lỗi lấy danh sách nhà cung cấp:", err);
            }
        };

        React.useEffect(() => {
            fetchSuppliers();
        }, []);

        // Tìm kiếm theo SĐT
        const handleSearchChange = (e) => {
            const val = e.target.value;
            setSearchPhone(val);
            fetchSuppliers(val);
        };

        // 2. Thêm mới hoặc Cập nhật Nhà Cung Cấp
        const handleSave = async (e) => {
            e.preventDefault();
            try {
                const payload = {
                    supplierName: form.supplierName,
                    phone: form.phone,
                    email: form.email,
                    address: form.address
                };

                const isEdit = editingId !== null;
                const url = isEdit ? `/api/suppliers/${editingId}` : '/api/suppliers';
                const method = isEdit ? 'PUT' : 'POST';

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                const data = await res.json();

                if (res.ok && data.success !== false) {
                    if (typeof showToast === 'function') {
                        showToast(data.message || (isEdit ? 'Cập nhật nhà cung cấp thành công!' : 'Thêm nhà cung cấp thành công!'));
                    }
                    setForm({ supplierName: '', phone: '', email: '', address: '' });
                    setEditingId(null);
                    fetchSuppliers(searchPhone);
                } else {
                    const msg = data.message || (data.errors ? Object.values(data.errors).join(', ') : 'Lỗi dữ liệu nhà cung cấp!');
                    if (typeof showToast === 'function') showToast(msg, 'error');
                }
            } catch (err) {
                if (typeof showToast === 'function') showToast('Lỗi kết nối Server Backend!', 'error');
            }
        };

        // 3. Chọn dòng để sửa
        const handleEditClick = (s) => {
            setEditingId(s.supplierID);
            setForm({
                supplierName: s.supplierName || '',
                phone: s.phone || '',
                email: s.email || '',
                address: s.address || ''
            });
        };

        // 4. Hủy sửa
        const handleCancelEdit = () => {
            setEditingId(null);
            setForm({ supplierName: '', phone: '', email: '', address: '' });
        };

        // 5. Mở Modal xóa
        const openDeleteModal = (id, name) => {
            setDeleteModal({ show: true, id, name });
        };

        // 6. Thực hiện xóa
        const confirmDelete = async () => {
            const { id } = deleteModal;
            setDeleteModal({ show: false, id: null, name: '' });

            try {
                const res = await fetch(`/api/suppliers/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok && data.success !== false) {
                    if (typeof showToast === 'function') showToast(data.message || 'Xóa nhà cung cấp thành công!');
                    fetchSuppliers(searchPhone);
                } else {
                    if (typeof showToast === 'function') showToast(data.message || 'Xóa thất bại!', 'error');
                }
            } catch (err) {
                if (typeof showToast === 'function') showToast('Lỗi kết nối Backend!', 'error');
            }
        };

        return (
            <div className="grid grid-cols-3 gap-6 relative">
                {/* DANH SÁCH NHÀ CUNG CẤP */}
                <div className="col-span-2 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                            Danh Sách Nhà Cung Cấp (PostgreSQL)
                        </h3>
                        <input
                            type="text"
                            placeholder="🔍 Tìm theo SĐT..."
                            value={searchPhone}
                            onChange={handleSearchChange}
                            className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1 text-xs text-slate-200 w-48 focus:outline-none focus:border-blue-500"
                        />
                    </div>

                    <table className="w-full text-left text-xs">
                        <thead>
                        <tr className="border-b border-slate-800 text-slate-400">
                            <th className="pb-3 px-2">ID NCC</th>
                            <th className="pb-3 px-2">Tên Nhà Cung Cấp</th>
                            <th className="pb-3 px-2">Số Điện Thoại</th>
                            <th className="pb-3 px-2">Email</th>
                            <th className="pb-3 px-2">Địa Chỉ</th>
                            <th className="pb-3 px-2 text-center">Thao Tác</th>
                        </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800/50">
                        {suppliers.length === 0 ? (
                            <tr>
                                <td colSpan="6" className="py-4 text-center text-slate-500">
                                    {searchPhone ? `Không tìm thấy NCC với SĐT: "${searchPhone}"` : 'Chưa có dữ liệu nhà cung cấp'}
                                </td>
                            </tr>
                        ) : (
                            suppliers.map(s => (
                                <tr key={s.supplierID} className="hover:bg-slate-800/30 transition">
                                    <td className="py-3 px-2 font-semibold text-slate-400">#{s.supplierID}</td>
                                    <td className="py-3 px-2 font-bold text-slate-200">{s.supplierName}</td>
                                    <td className="py-3 px-2 text-blue-400 font-mono">{s.phone}</td>
                                    <td className="py-3 px-2 text-slate-400">{s.email || '—'}</td>
                                    <td className="py-3 px-2 text-slate-400">{s.address || '—'}</td>
                                    <td className="py-3 px-2 text-center space-x-2">
                                        <button
                                            onClick={() => handleEditClick(s)}
                                            className="px-2 py-1 bg-amber-500/10 hover:bg-amber-500/20 text-amber-400 rounded border border-amber-500/30 text-[11px] transition"
                                        >
                                            ✏️ Sửa
                                        </button>
                                        <button
                                            onClick={() => openDeleteModal(s.supplierID, s.supplierName)}
                                            className="px-2 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded border border-red-500/30 text-[11px] transition"
                                        >
                                            🗑️ Xóa
                                        </button>
                                    </td>
                                </tr>
                            ))
                        )}
                        </tbody>
                    </table>
                </div>

                {/* FORM THÊM / SỬA NHÀ CUNG CẤP (NHẬP TAY 100%) */}
                <div className="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5 h-fit">
                    <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                        <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                            {editingId ? `Sửa NCC #${editingId}` : 'Thêm Nhà Cung Cấp Mới'}
                        </h3>
                        {editingId && (
                            <button onClick={handleCancelEdit} className="text-[10px] text-slate-400 hover:text-white underline">
                                Hủy sửa
                            </button>
                        )}
                    </div>

                    <form onSubmit={handleSave} className="space-y-3">
                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Tên Nhà Cung Cấp (*):</label>
                            <input
                                type="text"
                                required
                                placeholder="Nhập tên công ty / NCC..."
                                value={form.supplierName}
                                onChange={e => setForm({...form, supplierName: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            />
                        </div>

                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Số Điện Thoại (*):</label>
                            <input
                                type="text"
                                required
                                placeholder="VD: 0987654321"
                                value={form.phone}
                                onChange={e => setForm({...form, phone: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none font-mono"
                            />
                        </div>

                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Email:</label>
                            <input
                                type="email"
                                placeholder="VD: ncc@gmail.com"
                                value={form.email}
                                onChange={e => setForm({...form, email: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            />
                        </div>

                        <div>
                            <label className="text-[11px] text-slate-400 mb-1 block">Địa Chỉ:</label>
                            <input
                                type="text"
                                placeholder="Nhập địa chỉ nhà cung cấp..."
                                value={form.address}
                                onChange={e => setForm({...form, address: e.target.value})}
                                className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-slate-200 focus:border-blue-500 focus:outline-none"
                            />
                        </div>

                        <button
                            type="submit"
                            className={`w-full font-semibold py-2.5 rounded-xl text-xs transition shadow-lg mt-2 text-white ${
                                editingId
                                    ? 'bg-amber-600 hover:bg-amber-500 shadow-amber-600/20'
                                    : 'bg-blue-600 hover:bg-blue-500 shadow-blue-600/20'
                            }`}
                        >
                            {editingId ? 'Cập Nhật Nhà Cung Cấp' : 'Thêm Nhà Cung Cấp'}
                        </button>
                    </form>
                </div>

                {/* MODAL XÁC NHẬN XÓA DARK MODE */}
                {deleteModal.show && (
                    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-sm w-full shadow-2xl animate-fade-in">
                            <div className="w-12 h-12 rounded-full bg-red-500/10 border border-red-500/20 text-red-500 flex items-center justify-center mx-auto mb-4 text-xl">
                                ⚠️
                            </div>
                            <h4 className="text-sm font-bold text-slate-200 text-center mb-2">Xác nhận xóa nhà cung cấp?</h4>
                            <p className="text-xs text-slate-400 text-center mb-6">
                                Bạn có chắc chắn muốn xóa nhà cung cấp <span className="text-red-400 font-semibold">"{deleteModal.name}"</span> (Mã #{deleteModal.id}) khỏi hệ thống?
                            </p>
                            <div className="flex gap-3">
                                <button
                                    onClick={() => setDeleteModal({ show: false, id: null, name: '' })}
                                    className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium py-2 rounded-xl text-xs transition"
                                >
                                    Hủy bỏ
                                </button>
                                <button
                                    onClick={confirmDelete}
                                    className="flex-1 bg-red-600 hover:bg-red-500 text-white font-medium py-2 rounded-xl text-xs transition shadow-lg shadow-red-600/20"
                                >
                                    Đồng ý Xóa
                                </button>
                            </div>
                        </div>
                    </div>
                )}
            </div>
        );
    }

    // --- MODULE 5: BÁN HÀNG & POS HÓA ĐƠN (GỌI /api/invoices) ---
    function InvoicePOSView({ products, refresh, showToast }) {
        const [cart, setCart] = React.useState([]);
        const [invoices, setInvoices] = React.useState([]);
        const [searchCustomer, setSearchCustomer] = React.useState('');
        const [searchProduct, setSearchProduct] = React.useState('');
        const [employeeId, setEmployeeId] = React.useState('');
        const [customerId, setCustomerId] = React.useState('');

        const [detailModal, setDetailModal] = React.useState({ show: false, invoiceId: null, items: [] });
        const [deleteModal, setDeleteModal] = React.useState({ show: false, id: null });

        React.useEffect(() => {
            if (typeof refresh === 'function') {
                refresh();
            }
            fetchInvoices();
        }, []);

        const fetchInvoices = async (custName = '') => {
            try {
                const url = custName.trim()
                    ? `/api/invoices?customerName=${encodeURIComponent(custName.trim())}`
                    : '/api/invoices';
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    setInvoices(data);
                }
            } catch (err) {
                console.error("Lỗi lấy lịch sử hóa đơn:", err);
            }
        };

        const filteredProducts = (products || []).filter(p => {
            const query = searchProduct.toLowerCase().trim();
            if (!query) return true;
            const pName = (p.productName || p.name || '').toLowerCase();
            const pId = String(p.productID || p.productId || p.id || '');
            return pName.includes(query) || pId.includes(query);
        });

        const addToCart = (p) => {
            const pId = p.productID || p.productId || p.id;
            const pPrice = Number(p.price || 0);
            const pStock = Number(p.stock || 0);

            const exist = cart.find(x => x.productID === pId);
            if (exist) {
                if (exist.quantity >= pStock) {
                    if (typeof showToast === 'function') showToast(`Chỉ còn ${pStock} sản phẩm trong kho!`, 'error');
                    return;
                }
                setCart(cart.map(x => x.productID === pId ? { ...x, quantity: x.quantity + 1 } : x));
            } else {
                if (pStock < 1) {
                    if (typeof showToast === 'function') showToast('Sản phẩm đã hết hàng!', 'error');
                    return;
                }
                setCart([...cart, {
                    productID: pId,
                    productName: p.productName || p.name,
                    unitPrice: pPrice,
                    quantity: 1,
                    maxStock: pStock
                }]);
            }
        };

        const updateQty = (pId, delta) => {
            setCart(cart.map(item => {
                if (item.productID === pId) {
                    const newQty = item.quantity + delta;
                    if (newQty > item.maxStock) {
                        if (typeof showToast === 'function') showToast(`Không thể vượt quá tồn kho (${item.maxStock})!`, 'error');
                        return item;
                    }
                    return newQty > 0 ? { ...item, quantity: newQty } : null;
                }
                return item;
            }).filter(Boolean));
        };

        const removeFromCart = (pId) => {
            setCart(cart.filter(x => x.productID !== pId));
        };

        const totalAmount = cart.reduce((sum, item) => sum + (item.quantity * item.unitPrice), 0);

        const handleCheckout = async (e) => {
            e.preventDefault();
            if (cart.length === 0) {
                if (typeof showToast === 'function') showToast('Giỏ hàng đang trống!', 'error');
                return;
            }
            if (!employeeId || !customerId) {
                if (typeof showToast === 'function') showToast('Vui lòng nhập Mã NV và Mã KH!', 'error');
                return;
            }

            const payload = {
                employeeId: parseInt(employeeId),
                customerId: parseInt(customerId),
                details: cart.map(item => ({
                    productID: item.productID,
                    quantity: item.quantity,
                    unitPrice: item.unitPrice
                }))
            };

            try {
                const res = await fetch('/api/invoices', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (res.ok && data.success !== false) {
                    if (typeof showToast === 'function') showToast(data.message || 'Tạo hóa đơn thành công!');
                    setCart([]);
                    setEmployeeId('');
                    setCustomerId('');
                    fetchInvoices(searchCustomer);
                    if (typeof refresh === 'function') refresh();
                } else {
                    if (typeof showToast === 'function') showToast(data.message || 'Thanh toán thất bại!', 'error');
                }
            } catch (err) {
                if (typeof showToast === 'function') showToast('Lỗi gửi request tới Server!', 'error');
            }
        };

        const viewInvoiceDetails = async (invId) => {
            try {
                const res = await fetch(`/api/invoices/${invId}/details`);
                if (res.ok) {
                    const items = await res.json();
                    setDetailModal({ show: true, invoiceId: invId, items });
                }
            } catch (err) {
                if (typeof showToast === 'function') showToast('Lỗi lấy chi tiết hóa đơn!', 'error');
            }
        };

        const confirmDelete = async () => {
            const { id } = deleteModal;
            setDeleteModal({ show: false, id: null });

            try {
                const res = await fetch(`/api/invoices/${id}`, { method: 'DELETE' });
                const data = await res.json();
                if (res.ok && data.success !== false) {
                    if (typeof showToast === 'function') showToast(data.message || 'Xóa hóa đơn thành công!');
                    fetchInvoices(searchCustomer);
                    if (typeof refresh === 'function') refresh();
                } else {
                    if (typeof showToast === 'function') showToast(data.message || 'Xóa thất bại!', 'error');
                }
            } catch (err) {
                if (typeof showToast === 'function') showToast('Lỗi kết nối Backend!', 'error');
            }
        };

        return (
            <div className="grid grid-cols-3 gap-6 relative">
                <div className="col-span-2 space-y-6">
                    {/* DANG SACH SAN PHAM */}
                    <div className="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5">
                        <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                            <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                                Chọn Sản Phẩm Vào Giỏ Hàng
                            </h3>
                            <input
                                type="text"
                                placeholder="🔍 Tìm tên hoặc ID sản phẩm..."
                                value={searchProduct}
                                onChange={(e) => setSearchProduct(e.target.value)}
                                className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1 text-xs text-slate-200 w-64 focus:outline-none focus:border-blue-500"
                            />
                        </div>

                        <div className="grid grid-cols-3 gap-3 max-h-64 overflow-y-auto pr-1">
                            {filteredProducts.length === 0 ? (
                                <p className="col-span-3 text-xs text-slate-500 text-center py-6">
                                    {searchProduct ? `Không tìm thấy sản phẩm khớp với "${searchProduct}"` : 'Chưa có sản phẩm nào trong CSDL'}
                                </p>
                            ) : (
                                filteredProducts.map(p => {
                                    const stock = p.stock || 0;
                                    const pId = p.productID || p.productId || p.id;
                                    return (
                                        <div
                                            key={pId}
                                            onClick={() => addToCart(p)}
                                            className={`bg-slate-950 border rounded-xl p-3 cursor-pointer transition flex flex-col justify-between ${
                                                stock > 0
                                                    ? 'border-slate-800 hover:border-blue-500/80 hover:bg-slate-900/80'
                                                    : 'border-slate-900 opacity-50 cursor-not-allowed'
                                            }`}
                                        >
                                            <div>
                                                <div className="text-xs font-bold text-slate-200 truncate">{p.productName || p.name}</div>
                                                <div className="text-[10px] text-slate-400 mt-0.5">Mã SP: #{pId}</div>
                                            </div>
                                            <div className="flex items-center justify-between mt-3 pt-2 border-t border-slate-800/60">
                                            <span className={`text-[10px] px-1.5 py-0.5 rounded font-medium ${stock > 0 ? 'bg-slate-800 text-slate-300' : 'bg-red-950 text-red-400'}`}>
                                                Kho: {stock}
                                            </span>
                                                <span className="text-xs font-bold text-emerald-400 font-mono">
                                                {Number(p.price || 0).toLocaleString('vi-VN')} ₫
                                            </span>
                                            </div>
                                        </div>
                                    );
                                })
                            )}
                        </div>
                    </div>

                    {/* LICH SU HOA DON - CO THANH CUON KHONG LO SO LUONG HOA DON LON */}
                    <div className="bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5">
                        <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-800">
                            <h3 className="text-xs font-bold text-slate-300 uppercase tracking-wider">
                                Lịch Sử Hóa Đơn (PostgreSQL)
                            </h3>
                            <input
                                type="text"
                                placeholder="🔍 Lọc theo tên Khách hàng..."
                                value={searchCustomer}
                                onChange={(e) => {
                                    setSearchCustomer(e.target.value);
                                    fetchInvoices(e.target.value);
                                }}
                                className="bg-slate-950 border border-slate-800 rounded-lg px-3 py-1 text-xs text-slate-200 w-56 focus:outline-none focus:border-blue-500"
                            />
                        </div>

                        <div className="max-h-64 overflow-y-auto pr-1">
                            <table className="w-full text-left text-xs">
                                <thead className="sticky top-0 bg-slate-900 z-10">
                                <tr className="border-b border-slate-800 text-slate-400">
                                    <th className="pb-3 px-2">Mã HĐ</th>
                                    <th className="pb-3 px-2">Nhân Viên</th>
                                    <th className="pb-3 px-2">Khách Hàng</th>
                                    <th className="pb-3 px-2">Ngày Tạo</th>
                                    <th className="pb-3 px-2">Tổng Tiền</th>
                                    <th className="pb-3 px-2 text-center">Thao Tác</th>
                                </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-800/50">
                                {invoices.length === 0 ? (
                                    <tr>
                                        <td colSpan="6" className="py-4 text-center text-slate-500">
                                            Chưa có hóa đơn nào
                                        </td>
                                    </tr>
                                ) : (
                                    invoices.map(inv => (
                                        <tr key={inv[0]} className="hover:bg-slate-800/30 transition">
                                            <td className="py-3 px-2 font-bold text-blue-400 font-mono">#HĐ00{inv[0]}</td>
                                            <td className="py-3 px-2 font-medium text-slate-300">{inv[1]}</td>
                                            <td className="py-3 px-2 font-bold text-slate-200">{inv[2]}</td>
                                            <td className="py-3 px-2 text-slate-400 font-mono">{inv[3]}</td>
                                            <td className="py-3 px-2 font-bold text-emerald-400 font-mono">{inv[4]}</td>
                                            <td className="py-3 px-2 text-center space-x-2">
                                                <button
                                                    onClick={() => viewInvoiceDetails(inv[0])}
                                                    className="px-2 py-1 bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 rounded border border-blue-500/30 text-[11px] transition"
                                                >
                                                    👁️ Chi tiết
                                                </button>
                                                <button
                                                    onClick={() => setDeleteModal({ show: true, id: inv[0] })}
                                                    className="px-2 py-1 bg-red-500/10 hover:bg-red-500/20 text-red-400 rounded border border-red-500/30 text-[11px] transition"
                                                >
