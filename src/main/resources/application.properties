# Cấu hình Server Port
server.port=8080

# Cấu hình kết nối PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/shopmanager
spring.datasource.username=postgres
spring.datasource.password=nguyenrikkei
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình HikariCP Connection Pool (Tối ưu hiệu năng Web)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=ShopManagerHikariCP